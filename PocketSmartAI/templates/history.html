{% extends "base.html" %}
{% block title %}Recommendation History - PocketSmart{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Recommendation History</h1>
  <p>Review past generated budgets, allocations, and product matches</p>
</div>

<div class="form-card">
  <div id="historyListContainer" style="display: flex; flex-direction: column; gap: 1rem;">
    <p style="color: var(--text-muted); text-align: center;">Loading history...</p>
  </div>
</div>

<div id="modalBackdrop" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center;">
  <div class="form-card" style="max-width: 650px; width:90%; max-height:80vh; overflow-y:auto; position:relative;">
    <button onclick="closeModal()" style="position:absolute; right:15px; top:15px; background:none; border:none; font-size:1.2rem; cursor:pointer;">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
async function loadHistory() {
  const container = document.getElementById('historyListContainer');
  const res = await fetch('/recommendation-history');
  const data = await res.json();

  if (!data.history || data.history.length === 0) {
    container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No history found yet.</p>';
    return;
  }

  container.innerHTML = '';
  data.history.forEach(item => {
    container.innerHTML += `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:1rem; border:1px solid var(--border-light); border-radius:8px; background:#fff;">
        <div>
          <span class="badge-link badge-generic" style="text-transform:uppercase;">${item.type}</span>
          <h4 style="margin: 0.3rem 0; color: var(--primary-navy);">${item.input}</h4>
          <p style="font-size:0.85rem; color: var(--text-muted);">${item.summary} &bull; ${item.timestamp}</p>
        </div>
        <button onclick="viewDetails('${item.id}')" class="badge-link badge-amazon" style="border:none; cursor:pointer; padding:0.4rem 0.8rem;">View Plan</button>
      </div>
    `;
  });
}

async function viewDetails(id) {
  const res = await fetch(`/recommendation-details/${id}`);
  const data = await res.json();
  const mContent = document.getElementById('modalContent');
  mContent.innerHTML = `
    <h3 style="color: var(--primary-navy); margin-bottom: 0.5rem;">${data.type.toUpperCase()} Budget Detail</h3>
    <p style="color: var(--text-muted); font-size:0.85rem; margin-bottom: 1rem;">Created: ${data.timestamp}</p>
    <pre style="background:#f1f5f9; padding:1rem; border-radius:6px; font-size:0.8rem; overflow-x:auto;">${JSON.stringify(data.full_result, null, 2)}</pre>
  `;
  document.getElementById('modalBackdrop').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modalBackdrop').style.display = 'none';
}

loadHistory();
</script>
{% endblock %}
